[project]
name = "igra-sentinel-stack"
version = "0.1.0"
description = "Chain Sentinel for Igra EVM — Galleon testnet rehearsal + mainnet read probes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
igra-sentinel = "sentinel_stack.api:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_stack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

services:
  sentinel:
    build: .
    # Dev publish. docker-compose.prod.yml must !override this so production binds 127.0.0.1 only.
    ports:
      - "8790:8790"
    environment:
      SENTINEL_API_HOST: 0.0.0.0
      SENTINEL_API_PORT: 8790
      GALLEON_RPC: https://galleon-testnet.igralabs.com:8545
      IGRA_MAINNET_RPC: https://rpc.igralabs.com:8545
    restart: unless-stopped
